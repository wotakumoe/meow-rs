[package]
name = "meow-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
scraper = "0.20"
regex = "1.10"
urlencoding = "2.1"
rayon = "1.8"
once_cell = "1.19"
tokio = { version = "1.0", features = ["full"] }
